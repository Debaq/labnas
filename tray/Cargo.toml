[package]
name = "labnas-tray"
version = "3.8.0"
edition = "2024"
description = "Control de la musica de LabNAS desde la bandeja del sistema (Windows y Linux)"

[dependencies]
dirs = "7.0.0"
gethostname = "1.1.0"
getrandom = "0.3.4"
mdns-sd = "0.22"
open = "5.3.3"
png = "0.18.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
# teclas multimedia y controles del sistema (MPRIS en Linux, SMTC en Windows)
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
notify-rust = "4"
sha2 = "0.11.1"
tao = "0.37.0"
wry = "0.57"
webpki-roots = "1.0"

# Linux: StatusNotifierItem directo por D-Bus (ksni), que entrega el clic izquierdo
# (libappindicator siempre abre el menu)
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }

# Windows: saber si el widget sigue siendo la ventana activa
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
