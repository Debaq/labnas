[package]
name = "labnas-tray"
version = "3.5.1"
edition = "2024"
description = "Control de la musica de LabNAS desde la bandeja del sistema (Windows y Linux)"

[dependencies]
dirs = "7.0.0"
gethostname = "1.1.0"
getrandom = "0.3.4"
mdns-sd = "0.22"
open = "5.3.3"
png = "0.18.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
sha2 = "0.11.1"
tao = "0.37.0"
wry = "0.57"
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }
webpki-roots = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
