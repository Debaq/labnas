[package]
name = "labnas-backend"
version = "3.5.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
surge-ping = "0.8"
local-ip-address = "0.6"
dns-lookup = "2"
sysinfo = "0.35"
portable-pty = "0.9"
futures-util = "0.3"
# rustls (sin OpenSSL): el OpenSSL 4 de algunas distros rompe openssl-sys y musl no lo trae
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
tokio-tungstenite = "0.24"
bcrypt = "0.17"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mailparse = "0.16.1"
urlencoding = "2.1.3"
url = "2.5"
mdns-sd = "0.20.0"
libc = "0.2"
regex-lite = "0.1"
rusqlite = { version = "0.42", features = ["bundled", "functions", "fallible_uint"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"
serialport = "4"
tokio-util = { version = "0.7.19", features = ["io"] }
sha2 = "0.11.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
base64 = "0.23.1"
dav-server = { version = "0.12", default-features = false, features = ["localfs"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14"
x509-parser = "0.18"
hmac = "0.13"
sha1 = "0.11"
getrandom = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "9.7.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
ciborium = "0.2.2"
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15"] }
minisign-verify = "0.3.0"
jpeg-encoder = "0.7"
# Deteccion con IA en camaras: ONNX en Rust puro (sirve en el binario estatico musl)
tract-onnx = "0.23"
zune-jpeg = "0.4"

[features]
default = []
# Sin efecto (antes compilaba OpenSSL); se mantiene para no romper scripts de build viejos
vendored-ssl = []
