[package]
name = "labnas-viewer"
version = "3.4.3"
edition = "2024"

[dependencies]
dirs = "7.0.0"
mdns-sd = "0.22"
png = "0.18.1"
serde_json = "1.0.151"
sha2 = "0.11.1"
tao = "0.37.0"
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }
webkit2gtk = { version = "2.0.2", features = ["v2_6"] }
wry = "0.57.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
