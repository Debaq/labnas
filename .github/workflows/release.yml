name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Extraer version del tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (musl estatico)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar musl tools y deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config perl make

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ matrix.arch }}-musl-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build --emptyOutDir

      - name: Build backend (release, estatico)
        working-directory: backend
        env:
          OPENSSL_STATIC: "1"
        run: cargo build --release --target ${{ matrix.target }} --features vendored-ssl

      - name: Empaquetar release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"
          RELEASE_DIR="labnas"
          mkdir -p "$RELEASE_DIR"

          # Binario estatico
          cp backend/target/$TARGET/release/labnas-backend "$RELEASE_DIR/"

          # Frontend
          cp -r frontend/dist "$RELEASE_DIR/dist"

          # Scripts y config
          cp labnas.sh "$RELEASE_DIR/"
          cp setup-tailscale.sh "$RELEASE_DIR/" 2>/dev/null || true
          cp VERSION "$RELEASE_DIR/"

          # Tarball
          TARBALL="labnas-v${VERSION}-linux-${ARCH}.tar.gz"
          tar czf "$TARBALL" "$RELEASE_DIR"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - name: Crear release si no existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Reintentar hasta 5 veces para evitar race entre jobs paralelos
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" &>/dev/null; then
              echo "Release $TAG ya existe"
              exit 0
            fi
            if gh release create "$TAG" \
                --title "LabNAS $VERSION" \
                --generate-notes 2>/dev/null; then
              echo "Release $TAG creado"
              exit 0
            fi
            echo "Reintento $i..."
            sleep 3
          done
          # Verificacion final
          gh release view "$TAG"

      - name: Subir asset al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" "${{ env.tarball }}" --clobber
