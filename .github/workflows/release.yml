name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            use_cross: false
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            use_cross: false
          - arch: armv7
            runner: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            use_cross: true

    steps:
      - uses: actions/checkout@v7

      - name: Extraer version del tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar musl tools y deps (build nativo)
        if: matrix.use_cross == false
        run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config perl make

      - name: Instalar cross (build cruzado)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build --emptyOutDir

      # La clave publica minisign queda embebida en el binario: el updater exige firma valida
      - name: Build backend (nativo)
        if: matrix.use_cross == false
        working-directory: backend
        env:
          LABNAS_MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBKEY }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # cross monta solo backend/ en el contenedor; el conector PHP (include_str! de
      # ../bridge) se monta aparte, tanto si el proyecto queda en /project como en su ruta real
      - name: Build backend (cross)
        if: matrix.use_cross == true
        working-directory: backend
        env:
          LABNAS_MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBKEY }}
          CROSS_CONTAINER_OPTS: >-
            -v ${{ github.workspace }}/bridge:/bridge:ro
            -v ${{ github.workspace }}/bridge:${{ github.workspace }}/bridge:ro
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Empaquetar release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"
          RELEASE_DIR="labnas"
          mkdir -p "$RELEASE_DIR"

          # Binario estatico
          cp backend/target/$TARGET/release/labnas-backend "$RELEASE_DIR/"

          # Frontend
          cp -r frontend/dist "$RELEASE_DIR/dist"

          # Scripts y config
          cp labnas.sh "$RELEASE_DIR/"
          cp setup-tailscale.sh "$RELEASE_DIR/" 2>/dev/null || true
          cp setup-mdns.sh setup-smart.sh labnas-smart-read setup-snapshots.sh labnas-snapshot setup-obico.sh "$RELEASE_DIR/"
          cp VERSION "$RELEASE_DIR/"

          # Tarball + checksum (el updater no instala sin .sha256)
          TARBALL="labnas-v${VERSION}-linux-${ARCH}.tar.gz"
          tar czf "$TARBALL" "$RELEASE_DIR"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - name: Firmar con minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBKEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            # Un binario con clave publica embebida no instalaria un release sin firma
            if [ -n "$MINISIGN_PUBKEY" ]; then
              echo "::error::MINISIGN_PUBKEY configurada pero falta el secreto MINISIGN_SECRET_KEY"
              exit 1
            fi
            echo "::warning::Release sin firmar (configura MINISIGN_SECRET_KEY y MINISIGN_PUBKEY, ver README)"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y minisign
          KEY="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY"
          chmod 600 "$KEY"
          VERSION="${{ steps.version.outputs.version }}"
          minisign -S -s "$KEY" -m "${{ env.tarball }}" -t "labnas v$VERSION ${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # El instalador lleva la clave publica para verificar el tarball
            sed -i "s|__MINISIGN_PUBKEY__|$MINISIGN_PUBKEY|" install.sh
            minisign -S -s "$KEY" -m install.sh -t "labnas v$VERSION install.sh"
            sha256sum install.sh > install.sh.sha256
          fi
          rm -f "$KEY"
          # Comprobar con la clave publica antes de publicar
          if [ -n "$MINISIGN_PUBKEY" ]; then
            minisign -V -P "$MINISIGN_PUBKEY" -m "${{ env.tarball }}"
          fi

      - name: Crear release si no existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Notas: la primera seccion del CHANGELOG (la version que se publica)
          awk '/^## \[/{n++; next} n==1' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "LabNAS $VERSION" > notes.md
          # Reintentar hasta 5 veces para evitar race entre jobs paralelos
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" &>/dev/null; then
              echo "Release $TAG ya existe"
              exit 0
            fi
            if gh release create "$TAG" \
                --title "LabNAS $VERSION" \
                --notes-file notes.md 2>/dev/null; then
              echo "Release $TAG creado"
              exit 0
            fi
            echo "Reintento $i..."
            sleep 3
          done
          # Verificacion final
          gh release view "$TAG"

      - name: Subir asset al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FILES=("${{ env.tarball }}" "${{ env.tarball }}.sha256")
          [ -f "${{ env.tarball }}.minisig" ] && FILES+=("${{ env.tarball }}.minisig")
          gh release upload "$TAG" "${FILES[@]}" --clobber

      # Una sola vez: releases/latest/download/install.sh apunta siempre al ultimo
      - name: Subir instalador
        if: matrix.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(install.sh)
          [ -f install.sh.minisig ] && FILES+=(install.sh.minisig install.sh.sha256)
          gh release upload "${{ steps.version.outputs.tag }}" "${FILES[@]}" --clobber

  viewer:
    name: Viewer ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Extraer version del tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar deps WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            viewer/target
          key: ${{ runner.os }}-viewer-${{ matrix.arch }}-cargo-${{ hashFiles('viewer/Cargo.lock') }}

      - name: Build viewer
        working-directory: viewer
        run: cargo build --release

      - name: Empaquetar viewer
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIR="labnas-viewer"
          mkdir -p "$DIR"
          cp viewer/target/release/labnas-viewer "$DIR/"
          cp -r viewer/assets "$DIR/assets"
          cp viewer/install.sh "$DIR/"
          TARBALL="labnas-viewer-v${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          tar czf "$TARBALL" "$DIR"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - name: Crear release si no existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Notas: la primera seccion del CHANGELOG (la version que se publica)
          awk '/^## \[/{n++; next} n==1' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "LabNAS $VERSION" > notes.md
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" &>/dev/null; then
              echo "Release $TAG ya existe"
              exit 0
            fi
            if gh release create "$TAG" \
                --title "LabNAS $VERSION" \
                --notes-file notes.md 2>/dev/null; then
              echo "Release $TAG creado"
              exit 0
            fi
            echo "Reintento $i..."
            sleep 3
          done
          gh release view "$TAG"

      - name: Subir asset al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" "${{ env.tarball }}" "${{ env.tarball }}.sha256" --clobber

  tray:
    name: Bandeja ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: viewer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x86_64
            runner: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Extraer version del tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar deps GTK y AppIndicator
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tray/target
          key: ${{ runner.os }}-tray-${{ matrix.arch }}-cargo-${{ hashFiles('tray/Cargo.lock') }}

      - name: Build bandeja
        working-directory: tray
        run: cargo build --release --locked

      - name: Empaquetar (Linux)
        if: matrix.os == 'linux'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIR="labnas-tray"
          mkdir -p "$DIR"
          cp tray/target/release/labnas-tray "$DIR/"
          cp tray/install.sh "$DIR/"
          ASSET="labnas-tray-v${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          tar czf "$ASSET" "$DIR"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "asset=$ASSET" >> "$GITHUB_ENV"

      - name: Empaquetar (Windows)
        if: matrix.os == 'windows'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # El .exe solo: LabNAS le agrega su direccion al final al descargarlo
          ASSET="labnas-tray-v${VERSION}-windows-${{ matrix.arch }}.exe"
          cp tray/target/release/labnas-tray.exe "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "asset=$ASSET" >> "$GITHUB_ENV"

      - name: Subir asset al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" "${{ env.asset }}" "${{ env.asset }}.sha256" --clobber
