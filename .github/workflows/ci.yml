name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (clippy + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Instalar deps del sistema
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev rsync ffmpeg

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-ci-backend-${{ hashFiles('backend/Cargo.lock') }}

      - name: clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: backend
        run: cargo test

  frontend:
    name: Frontend (tipos + lint + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Chequeo de tipos
        working-directory: frontend
        run: npx tsc -b

      - name: ESLint
        working-directory: frontend
        run: npx eslint .

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx vite build --emptyOutDir

  viewer:
    name: Viewer (clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Instalar deps WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            viewer/target
          key: ${{ runner.os }}-ci-viewer-${{ hashFiles('viewer/Cargo.lock') }}

      - name: clippy
        working-directory: viewer
        run: cargo clippy -- -D warnings
