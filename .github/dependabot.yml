# Actualizaciones de dependencias: un PR semanal por ecosistema (agrupado)
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/backend", "/viewer"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
