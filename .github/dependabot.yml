# Actualizaciones de dependencias: un PR semanal por ecosistema (agrupado), solo parches y
# versiones menores. Los saltos mayores rompen la API y se hacen a mano (los avisos de
# seguridad de Dependabot llegan igual: no dependen de esta configuracion).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/backend", "/viewer"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
